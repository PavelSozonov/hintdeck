name: PR rules

# Separate from CI so that editing the title or description, or adding a label, re-runs only this.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: pr-rules-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  release-rules:
    name: release-rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Permanent numbers, version bump and changelog
        env:
          # A maintainer adds the skip-release label to a contribution; the version is then bumped
          # later in a release pull request. Tip numbers are checked either way.
          SKIP_RELEASE: ${{ contains(github.event.pull_request.labels.*.name, 'skip-release') }}
        run: scripts/check-release.sh "origin/${{ github.base_ref }}"
      - name: Title and description (they become the squash commit on main)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: scripts/check-commit-msg.sh --pr
